
<div class="products-container">

  <div class="product-card" *ngFor="let product of products">

    <img [src]="product.imageUrl" [alt]="product.name">

    <h3>{{ product.name }}</h3>

    <p>${{ product.price }}</p>

    <button (click)="addToCart(product)">
      Agregar al carrito
    </button>

  </div>

</div>
